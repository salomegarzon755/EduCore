<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCore - Cuenta creada</title>
    <link rel="stylesheet" href="../css/InicioSesion.css">
</head>
<body class="page-body">

    <header class="main-header">
        <div class="brand-container">
        <div src="../img/files/EduCore_Identidad/01_logos/png/logo_compacto_color.png" alt="Logo EduCore" class="brand-logo">
        <span class="brand-name">EduCore</span>
        </div>
        <a href="../index.html" class="back-link">← Volver al inicio</a>
    </header>

    <main class="main-content">
        <section class="hero-screen">
        
        <aside class="mascot-panel">
            <div class="mascot-avatar">
            <img src="../img/files/EduCore_Identidad/03_personajes/png/kokoi_celebracion.png" alt="Mascota Lúa" class="mascot-img">
            </div>
            <p class="mascot-bubble">¡Empecemos esta aventura con Kokoi!.</p>
        </aside>

        <article class="form-card success-card">
            <div class="success-status-badge">
            <span class="status-icon">✓</span>
            <span class="status-text">Cuenta creada</span>
            </div>

            <h1 class="success-title">¡Tu aventura comienza ahora!</h1>
            <p class="success-description">
            Hola, <span id="registeredNameDisplay">Sara</span>. Tu camino de matemáticas como <strong id="registeredRoleDisplay">estudiante</strong> te está esperando.
            </p>

            <a href="../index.html" class="cta-primary-btn">Explorar Matemáticas</a>
        </article>

        </section>
    </main>

    <script src="../js/inicioSesion.js"></script>
</body>
</html>
