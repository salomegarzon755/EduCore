<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCore - Mi Camino</title>
    <link rel="stylesheet" href="../../css/paneles.css">
    <link rel="stylesheet" href="../../css/PanelEstudiante.css">
</head>
<body class="student-body">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="../../img/files/EduCore_Identidad/01_logos/png/logo_compacto_color.png" alt="EduCore Logo" class="brand-logo">
            <span class="brand-title">EduCore</span>
        </div>
        <div class="sidebar-tag">Mi aventura</div>
        <nav class="sidebar-nav">
            <a href="Inicio.html" class="nav-item">
                <span class="nav-icon">🏠</span> Inicio
            </a>
            <a href="MiCamino.html" class="nav-item active">
                <span class="nav-icon">🗺️</span> Mi camino
            </a>
            <a href="MisGrupos.html" class="nav-item">
                <span class="nav-icon">👥</span> Mis grupos
            </a>
            <a href="MisCursos.html" class="nav-item">
                <span class="nav-icon">📚</span> Mis cursos
            </a>
            <a href="MiProgreso.html" class="nav-item">
                <span class="nav-icon">📊</span> Mi progreso
            </a>
            <a href="../Login.html" class="nav-item logout-btn logout-nav-item">
                <span class="nav-icon">🚪</span> Cerrar sesión
            </a>
        </nav>
        <div class="sidebar-banner">
            <span class="banner-icon">🌱</span>
            <div class="banner-text">
                <strong>Aprendemos desde Acandí</strong>
                <p>Cada paso cuenta.</p>
            </div>
        </div>
    </aside>

    <main class="main-wrapper">
        <header class="top-header">
            <span class="header-motto">Matemáticas a tu ritmo</span>
            <div class="user-profile">
                <div class="user-text">
                    <span class="user-name" id="displayStudentName">Luna</span>
                    <span class="user-grade">Estudiante</span>
                </div>
                <div class="user-avatar">😊</div>
                <a href="../Login.html" class="logout-btn" title="Cerrar sesión">
                    <img src="../../img/files/EduCore_Identidad/05_iconos/png/icono_inicio.png" alt="Salir" class="logout-icon">
                </a>
            </div>
        </header>

        <section class="content-section">
            <!-- HEADER DE NAVEGACIÓN DE UNIDADES Y AVANCE -->
            <div class="path-header-banner">
                <div>
                    <h1 id="pathCourseTitle" style="margin:0; font-size:26px; color:#2D3748; font-weight:800;">Tu aventura de Matemáticas</h1>
                    <p id="pathUnitSubtitle" style="margin:4px 0 0 0; color:#15803D; font-weight:800; font-size:17px;">Unidad 1: Explorando los números</p>
                </div>

                <div class="unit-nav-controls">
                    <button type="button" id="btnPrevUnit" class="btn-unit-nav" disabled>← Unidad anterior</button>
                    <span id="pathProgressBadge" class="path-progress-badge">0 de 4 estaciones completadas</span>
                    <button type="button" id="btnNextUnit" class="btn-unit-nav">Siguiente unidad →</button>
                </div>
            </div>

            <!-- CONTENEDOR SLIDER RESPONSIVO CON ASPECT-RATIO 16/9 -->
            <div class="adventure-path-viewport">
                <div id="pathUnitsTrack" class="adventure-units-track">
                    <!-- Las unidades con fondo e hitos interactivos se renderizan aquí -->
                </div>
            </div>
        </section>
    </main>

    <script src="../../js/config.js"></script>
    <script src="../../js/panelEstudiante.js"></script>
    <script src="../../js/logout.js"></script>
</body>
</html>
